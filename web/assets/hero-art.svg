<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none">
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(372 248) rotate(90) scale(214)">
      <stop stop-color="#a98bff" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#6d5cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="296" y1="150" x2="452" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7b9ff"/>
      <stop offset=".45" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ring" x1="176" y1="226" x2="570" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity=".1"/>
      <stop offset=".45" stop-color="#a78bfa" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="80" y1="86" x2="248" y2="206" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="bar" x1="110" y1="124" x2="214" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="372" cy="248" r="214" fill="url(#halo)" filter="url(#soft)"/>
  <g opacity=".9">
    <ellipse cx="376" cy="252" rx="236" ry="98" transform="rotate(-18 376 252)" stroke="url(#ring)" stroke-width="1.3"/>
    <ellipse cx="376" cy="252" rx="196" ry="150" transform="rotate(52 376 252)" stroke="url(#ring)" stroke-width=".9" stroke-opacity=".55"/>
    <ellipse cx="376" cy="252" rx="270" ry="122" transform="rotate(28 376 252)" stroke="#fff" stroke-opacity=".13" stroke-width=".8"/>
  </g>
  <circle cx="376" cy="252" r="94" fill="url(#orb)" opacity=".22" filter="url(#soft)"/>
  <circle cx="376" cy="252" r="72" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="352" cy="226" r="25" fill="#fff" opacity=".2" filter="url(#soft)"/>
  <circle cx="508" cy="142" r="5" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="228" cy="348" r="4" fill="#ff7ab8" filter="url(#glow)"/>
  <circle cx="524" cy="364" r="3" fill="#c4b5fd"/>
  <path d="M226 348 302 302M508 142l-62 54M524 364l-88-34" stroke="#fff" stroke-opacity=".2" stroke-width="1"/>

  <g transform="translate(58 92)" filter="url(#glow)">
    <rect width="182" height="104" rx="20" fill="#0a0f22" fill-opacity=".76" stroke="url(#cardStroke)"/>
    <circle cx="34" cy="34" r="15" fill="url(#bar)" opacity=".9"/>
    <rect x="58" y="24" width="76" height="7" rx="3.5" fill="#fff" fill-opacity=".8"/>
    <rect x="58" y="39" width="48" height="5" rx="2.5" fill="#fff" fill-opacity=".3"/>
    <rect x="20" y="62" width="142" height="6" rx="3" fill="#fff" fill-opacity=".17"/>
    <rect x="20" y="76" width="108" height="6" rx="3" fill="#fff" fill-opacity=".1"/>
    <circle cx="146" cy="34" r="8" fill="#ff4d8d" fill-opacity=".85"/>
  </g>

  <g transform="translate(426 300)" filter="url(#glow)">
    <rect width="156" height="92" rx="20" fill="#0a0f22" fill-opacity=".78" stroke="url(#cardStroke)"/>
    <rect x="18" y="18" width="38" height="38" rx="12" fill="url(#bar)" opacity=".8"/>
    <rect x="68" y="24" width="58" height="6" rx="3" fill="#fff" fill-opacity=".7"/>
    <rect x="68" y="38" width="42" height="5" rx="2.5" fill="#fff" fill-opacity=".3"/>
    <rect x="18" y="68" width="118" height="5" rx="2.5" fill="#fff" fill-opacity=".12"/>
  </g>

  <g transform="translate(252 54)">
    <rect width="104" height="38" rx="19" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="21" cy="19" r="6" fill="#34d399"/>
    <rect x="36" y="14" width="52" height="5" rx="2.5" fill="#fff" fill-opacity=".55"/>
