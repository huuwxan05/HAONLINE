<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAONLINE - Mất kết nối</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 15%, #1b1740 0, #060814 55%);
      color: #eef1ff;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    main {
      width: min(440px, calc(100vw - 48px));
      padding: 36px;
      border: 1px solid #292750;
      border-radius: 20px;
      background: #0d1023;
      text-align: center;
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #8b7cff;
      color: #060814;
      font-size: 34px;
      font-weight: 800;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 24px; color: #a8afd0; line-height: 1.55; }
    button {
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 12px;
      background: #8b7cff;
      color: #060814;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    small { display: block; margin-top: 18px; color: #6f7698; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <div class="mark">H</div>
    <h1>Không thể kết nối HAONLINE</h1>
    <p>Kiểm tra kết nối mạng hoặc máy chủ HAONLINE, sau đó thử lại.</p>
    <button id="retry" type="button">Thử lại</button>
    <small id="target"></small>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get('url') || 'https://haonline.example.com';
    document.getElementById('target').textContent = target;
    document.getElementById('retry').addEventListener('click', () => {
      location.replace(target);
    });
  </script>
</body>
</html>
